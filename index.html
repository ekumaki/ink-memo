<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>インクメモ</title>
<meta name="description" content="Xマッチ・バンカラマッチの日報用メモ。ウデマエポイント、XP、ルールごとの勝敗を記録する。">
<meta name="theme-color" content="#16112B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="インクメモ">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=M+PLUS+Rounded+1c:wght@500;800&display=swap">
<style>
:root{
  --bg:#16112B; --bg2:#211A3F; --card:#241C46; --line:#3A3166; --ink:#F6F4FF; --muted:#A9A2CC;
  --yellow:#E8FF3A; --purple:#7B4BFF; --pink:#FF3EA5; --green:#2BE38A; --orange:#FF8A1F; --cyan:#2FD8FF;
  --win:var(--yellow); --lose:var(--purple);
  --f-display:"Dela Gothic One","Hiragino Sans","Yu Gothic",sans-serif;
  --f-body:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic UI",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{
  background:var(--bg);color:var(--ink);font-family:var(--f-body);font-weight:500;font-size:15px;line-height:1.6;
  min-height:100dvh;overflow-x:hidden;
  padding:calc(env(safe-area-inset-top,0px) + 10px) max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 28px) max(16px,env(safe-area-inset-left,0px));
}
button,input{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
:focus-visible{outline:3px solid var(--cyan);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:520px;margin:0 auto;position:relative;z-index:1;display:grid;gap:16px}

/* 背景のインク */
#bg{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
#bg svg{position:absolute;opacity:.22}

/* ヘッダー */
header{display:grid;gap:8px;padding-top:6px}
.brand{display:flex;align-items:center;justify-content:space-between;gap:10px}
.logo{font-family:var(--f-display);font-size:26px;line-height:1;letter-spacing:.02em;margin:0;display:flex;align-items:center;gap:8px}
.logo .splat{width:34px;height:34px;flex:none}
.logo span{background:linear-gradient(transparent 58%,var(--pink) 58%);padding:0 .08em}
.saved{font-size:12px;color:var(--muted);min-height:1em;transition:opacity .3s}
.datebar{display:flex;align-items:center;gap:6px;background:var(--bg2);border:2px solid var(--line);border-radius:999px;padding:4px}
.datebar .d{flex:1;text-align:center;font-family:var(--f-display);font-size:18px;line-height:1.2}
.datebar .d small{display:block;font-family:var(--f-body);font-size:11px;color:var(--muted);font-weight:800}
.round{width:42px;height:42px;border-radius:50%;border:0;background:var(--card);font-size:16px;flex:none}
.round:disabled{opacity:.3}
.todaybtn{border:0;background:var(--yellow);color:#16112B;font-weight:800;border-radius:999px;padding:8px 12px;font-size:13px;flex:none}
.todaybtn[hidden]{display:none}

/* カード */
.card{position:relative;background:var(--card);border-radius:22px;padding:16px;border:2px solid var(--line);overflow:hidden}
.card h2{margin:0 0 10px;font-family:var(--f-display);font-weight:400;font-size:15px;letter-spacing:.04em;display:flex;align-items:center;gap:8px}
.card h2 .dot{width:12px;height:12px;border-radius:58% 42% 50% 50%/45% 55% 45% 55%;flex:none}
.hint{font-size:12px;color:var(--muted);font-weight:500;margin-left:auto;letter-spacing:0;font-family:var(--f-body)}

/* 数値入力 */
.points{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pt{display:grid;gap:6px;min-width:0}
.pt label{font-size:13px;font-weight:800;color:var(--muted)}
.pt .box{display:flex;align-items:center;background:var(--bg);border:2px solid var(--line);border-radius:16px;padding:0 6px 0 4px;min-width:0}
.pt .box:focus-within{border-color:var(--cyan)}
.pt input{width:100%;min-width:0;border:0;background:none;outline:none;font-family:var(--f-display);font-size:26px;padding:8px 2px 8px 8px;text-align:right}
.pt input::placeholder{color:#4C4478}
.pt .unit{font-size:12px;font-weight:800;color:var(--muted);padding-left:4px}
.sign{width:34px;height:34px;flex:none;border-radius:10px;border:0;background:var(--line);font-weight:800;font-size:17px}
.sign[aria-pressed="true"]{background:var(--pink);color:#fff}
.diff{font-size:12px;font-weight:800;min-height:1.2em}
.diff.up{color:var(--green)} .diff.down{color:var(--pink)}

/* ルール */
.rules{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-bottom:14px}
.rule{border:0;border-radius:16px;padding:9px 2px 7px;background:var(--bg);display:grid;justify-items:center;gap:3px;font-size:12px;font-weight:800;color:var(--muted);position:relative;transition:transform .12s}
.rule svg{width:26px;height:26px}
.rule .mini{font-size:10px;font-weight:800;color:var(--muted);min-height:1.2em}
.rule[aria-pressed="true"]{background:var(--rc);color:#16112B;transform:translateY(-2px) rotate(-2deg)}
.rule[aria-pressed="true"] .mini{color:#16112B}
.rule[aria-pressed="true"] svg{color:#16112B}

/* 勝ち負けボタン */
.score{display:flex;align-items:baseline;justify-content:center;gap:14px;font-family:var(--f-display);margin:2px 0 12px}
.score .n{font-size:46px;line-height:1}
.score .w{color:var(--win)} .score .l{color:#A88BFF}
.score .sep{font-size:24px;color:var(--muted)}
.score .rn{font-family:var(--f-body);font-weight:800;font-size:13px;color:var(--muted);align-self:center}
.wl{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.big{position:relative;border:0;height:112px;font-family:var(--f-display);font-size:30px;letter-spacing:.04em;overflow:hidden;
  transition:transform .08s;display:grid;place-items:center;line-height:1}
.big>span{position:relative;z-index:1}
.big small{display:block;font-family:var(--f-body);font-size:12px;font-weight:800;letter-spacing:.1em;margin-top:6px;opacity:.8}
.big.win{background:var(--win);color:#16112B;border-radius:46% 54% 42% 58%/58% 44% 56% 42%}
.big.lose{background:var(--lose);color:#fff;border-radius:55% 45% 57% 43%/44% 58% 42% 56%}
.big:active{transform:scale(.94) rotate(-2deg)}
.undo{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:8px}
.undo button{border:2px dashed var(--line);background:none;border-radius:12px;padding:6px;font-size:12px;font-weight:800;color:var(--muted)}
.undo button:disabled{opacity:.35}
.splash{position:absolute;pointer-events:none;width:150px;height:150px;margin:-75px 0 0 -75px;animation:pop .5s ease-out forwards}
@keyframes pop{from{transform:scale(.2) rotate(0);opacity:.95}to{transform:scale(1.25) rotate(25deg);opacity:0}}

/* 集計 */
.table{display:grid;gap:6px}
.trow{display:grid;grid-template-columns:72px 1fr 70px;gap:10px;align-items:center;font-size:14px}
.trow .rname{font-weight:800;display:flex;align-items:center;gap:6px}
.trow .rname i{width:10px;height:10px;border-radius:50%;background:var(--rc);flex:none}
.trow .rate{text-align:right;font-weight:800;color:var(--muted)}
.track{position:relative;height:16px;border-radius:999px;background:var(--bg);overflow:hidden;display:flex}
.track .tw{background:var(--win)} .track .tl{background:var(--lose)}
.trow .wltext{font-size:11px;color:var(--muted);font-weight:800;margin-top:2px}
.total{display:flex;justify-content:space-between;align-items:baseline;border-top:2px dashed var(--line);margin-top:8px;padding-top:10px}
.total .big2{font-family:var(--f-display);font-size:22px}
.total .rt{font-family:var(--f-display);font-size:22px;color:var(--yellow)}
.empty{color:var(--muted);font-size:13px;text-align:center;padding:6px 0}

/* 書き出し */
.copybtn{width:100%;border:0;background:var(--pink);color:#fff;font-family:var(--f-display);font-size:18px;padding:16px;border-radius:18px 24px 16px 26px/22px 16px 24px 18px;letter-spacing:.04em}
.copybtn:active{transform:scale(.97)}
pre.preview{margin:10px 0 0;white-space:pre-wrap;font-family:var(--f-body);font-size:13px;background:var(--bg);border-radius:14px;padding:12px;color:var(--muted);border:2px solid var(--line)}

/* 履歴 */
.hist{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.hist li button{width:100%;display:grid;grid-template-columns:78px 1fr auto;gap:8px;align-items:center;text-align:left;border:0;background:var(--bg);border-radius:14px;padding:10px 12px;font-size:13px}
.hist .hd{font-weight:800}
.hist .hs{color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hist .hr{font-family:var(--f-display);font-size:15px}
.hist li.cur button{outline:2px solid var(--yellow)}

.foot{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.linkbtn{border:0;background:none;color:var(--muted);font-size:12px;font-weight:800;text-decoration:underline;text-underline-offset:3px;padding:6px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--yellow);color:#16112B;font-weight:800;padding:10px 18px;border-radius:999px;z-index:10;font-size:14px;box-shadow:0 6px 20px rgba(0,0,0,.4);max-width:calc(100% - 32px);text-align:center}
.toast[hidden]{display:none}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="bg" aria-hidden="true"></div>

<div class="wrap">
  <header>
    <div class="brand">
      <h1 class="logo"><svg class="splat" id="logo-splat" viewBox="0 0 100 100" aria-hidden="true"></svg><span>インクメモ</span></h1>
      <div class="saved" id="saved" aria-live="polite"></div>
    </div>
    <div class="datebar">
      <button class="round" id="prev" aria-label="前の日">◀</button>
      <div class="d num" id="date"></div>
      <button class="todaybtn" id="today" hidden>今日</button>
      <button class="round" id="next" aria-label="次の日">▶</button>
    </div>
  </header>

  <section class="card" aria-labelledby="h-points">
    <h2 id="h-points"><span class="dot" style="background:var(--cyan)"></span>ポイント<span class="hint">終わったときの数字</span></h2>
    <div class="points">
      <div class="pt">
        <label for="udemae">ウデマエpt</label>
        <div class="box">
          <button class="sign" id="ud-sign" aria-pressed="false" aria-label="マイナスにする">±</button>
          <input id="udemae" type="text" inputmode="numeric" autocomplete="off" placeholder="0">
          <span class="unit">pt</span>
        </div>
        <div class="diff num" id="ud-diff"></div>
      </div>
      <div class="pt">
        <label for="xp">XP</label>
        <div class="box">
          <input id="xp" type="text" inputmode="decimal" autocomplete="off" placeholder="0.0">
        </div>
        <div class="diff num" id="xp-diff"></div>
      </div>
    </div>
  </section>

  <section class="card" aria-labelledby="h-wl">
    <h2 id="h-wl"><span class="dot" style="background:var(--yellow)"></span>勝敗<span class="hint">ルールを選んでタップ</span></h2>
    <div class="rules" id="rules" role="group" aria-label="ルール"></div>
    <div class="score num" aria-live="polite"><span class="rn" id="cur-rule"></span><span class="n w" id="cur-w">0</span><span class="sep">-</span><span class="n l" id="cur-l">0</span></div>
    <div class="wl">
      <button class="big win" id="win"><span>WIN<small>勝ち ＋1</small></span></button>
      <button class="big lose" id="lose"><span>LOSE<small>負け ＋1</small></span></button>
    </div>
    <div class="undo">
      <button id="win-minus">勝ちを −1</button>
      <button id="lose-minus">負けを −1</button>
    </div>
  </section>

  <section class="card" aria-labelledby="h-sum">
    <h2 id="h-sum"><span class="dot" style="background:var(--green)"></span>きょうの集計</h2>
    <div class="table" id="table"></div>
  </section>

  <section class="card" aria-labelledby="h-copy">
    <h2 id="h-copy"><span class="dot" style="background:var(--pink)"></span>日報へ</h2>
    <button class="copybtn" id="copy">日報用にコピー</button>
    <pre class="preview" id="preview"></pre>
  </section>

  <section class="card" aria-labelledby="h-hist">
    <h2 id="h-hist"><span class="dot" style="background:var(--orange)"></span>これまで</h2>
    <ul class="hist" id="hist"></ul>
  </section>

  <div class="foot">
    <button class="linkbtn" id="clear">この日の記録を消す</button>
    <button class="linkbtn" id="backup">全データをコピー（バックアップ）</button>
  </div>
</div>
<div class="toast" id="toast" role="status" hidden></div>

<script>
(() => {
'use strict';
const KEY = 'ink-memo-v1';
const DAY_START_HOUR = 4; // 4 時までは前の日として記録する
const RULES = [
  { id:'ナワバリ', short:'ナワバリ', color:'#2BE38A' },
  { id:'エリア',   short:'エリア',   color:'#FF8A1F' },
  { id:'ヤグラ',   short:'ヤグラ',   color:'#2FD8FF' },
  { id:'ホコ',     short:'ホコ',     color:'#FF3EA5' },
  { id:'アサリ',   short:'アサリ',   color:'#E8FF3A' },
];
const ICONS = {
  'ナワバリ':'<path d="M4 18c2-6 6-9 10-9 2 0 3-2 2-4 3 1 5 4 4 7 2 1 3 3 2 6z" fill="currentColor"/>',
  'エリア':'<rect x="5" y="5" width="18" height="18" rx="3" fill="none" stroke="currentColor" stroke-width="3" stroke-dasharray="5 3"/><circle cx="14" cy="14" r="4" fill="currentColor"/>',
  'ヤグラ':'<path d="M7 24l3-14h8l3 14M9 16h10M8 20h12" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linejoin="round"/><path d="M8 10h12V6H8z" fill="currentColor"/>',
  'ホコ':'<path d="M14 3l4 7-4 3-4-3z" fill="currentColor"/><path d="M14 13v12" stroke="currentColor" stroke-width="3" stroke-linecap="round"/><circle cx="14" cy="13" r="3" fill="currentColor"/>',
  'アサリ':'<path d="M14 6c6 0 10 4 10 9 0 4-4 7-10 7S4 19 4 15c0-5 4-9 10-9z" fill="currentColor"/><path d="M14 8v12M10 9l1 11M18 9l-1 11" stroke="#16112B" stroke-width="1.6" opacity=".55"/>',
};
const WD = ['日','月','火','水','木','金','土'];
const $ = id => document.getElementById(id);
const pad = n => String(n).padStart(2, '0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parse = k => { const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (k, n) => { const d = parse(k); d.setDate(d.getDate() + n); return ymd(d); };
const gameToday = () => { const d = new Date(); if (d.getHours() < DAY_START_HOUR) d.setDate(d.getDate() - 1); return ymd(d); };
const mdw = k => { const d = parse(k); return `${d.getMonth() + 1}/${d.getDate()}(${WD[d.getDay()]})`; };

/* ---------- 保存 ---------- */
let store = { days:{}, rule:'エリア' };
try { const raw = localStorage.getItem(KEY); if (raw) store = Object.assign(store, JSON.parse(raw)); } catch (e) {}
let canSave = true;
function save(){
  try { localStorage.setItem(KEY, JSON.stringify(store)); flashSaved(); }
  catch (e) { if (canSave) toast('保存できませんでした。ブラウザの設定を確認してください'); canSave = false; }
}
let savedTimer;
function flashSaved(){
  const el = $('saved'); el.textContent = '保存しました'; el.style.opacity = 1;
  clearTimeout(savedTimer); savedTimer = setTimeout(() => { el.style.opacity = 0; }, 1400);
}
if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});

let cur = gameToday();
const day = (k = cur) => store.days[k] || { udemae:null, xp:null, rules:{} };
function edit(fn){
  const d = JSON.parse(JSON.stringify(day()));
  fn(d);
  d.updatedAt = new Date().toISOString();
  const empty = d.udemae == null && d.xp == null && !Object.values(d.rules).some(r => r.w || r.l);
  if (empty) delete store.days[cur]; else store.days[cur] = d;
  save();
}

/* ---------- インクの形 ---------- */
function rng(seed){ let s = seed >>> 0; return () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; }; }
function splatPath(seed, cx = 50, cy = 50, r = 30){
  const rand = rng(seed), n = 18, pts = [];
  for (let i = 0; i < n; i++){
    const a = (i / n) * Math.PI * 2 + rand() * 0.15;
    const rr = i % 2 ? r * (0.6 + rand() * 0.15) : r * (0.92 + rand() * 0.38);
    pts.push([cx + Math.cos(a) * rr, cy + Math.sin(a) * rr]);
  }
  let d = '';
  for (let i = 0; i < n; i++){
    const p0 = pts[(i - 1 + n) % n], p1 = pts[i], p2 = pts[(i + 1) % n], p3 = pts[(i + 2) % n];
    if (i === 0) d += `M${p1[0].toFixed(1)},${p1[1].toFixed(1)}`;
    const c1 = [p1[0] + (p2[0] - p0[0]) / 6, p1[1] + (p2[1] - p0[1]) / 6];
    const c2 = [p2[0] - (p3[0] - p1[0]) / 6, p2[1] - (p3[1] - p1[1]) / 6];
    d += `C${c1[0].toFixed(1)},${c1[1].toFixed(1)} ${c2[0].toFixed(1)},${c2[1].toFixed(1)} ${p2[0].toFixed(1)},${p2[1].toFixed(1)}`;
  }
  let drops = '';
  for (let i = 0; i < 5; i++){
    const a = rand() * Math.PI * 2, dist = r * (1.25 + rand() * 0.45), rr = 2 + rand() * 5;
    drops += `<circle cx="${(cx + Math.cos(a) * dist).toFixed(1)}" cy="${(cy + Math.sin(a) * dist).toFixed(1)}" r="${rr.toFixed(1)}"/>`;
  }
  return `<path d="${d}Z"/>${drops}`;
}
function splatSvg(seed, color){ return `<svg viewBox="0 0 100 100" fill="${color}">${splatPath(seed)}</svg>`; }

(function paintBg(){
  const bg = $('bg');
  const spots = [
    { x:-12, y:-4,  s:220, c:'#7B4BFF', seed:3 },
    { x:72,  y:16,  s:170, c:'#E8FF3A', seed:9 },
    { x:-8,  y:58,  s:150, c:'#FF3EA5', seed:21 },
    { x:66,  y:78,  s:240, c:'#2FD8FF', seed:14 },
  ];
  bg.innerHTML = spots.map(p => splatSvg(p.seed, p.c).replace('<svg', `<svg style="left:${p.x}%;top:${p.y}%;width:${p.s}px;height:${p.s}px"`)).join('');
  $('logo-splat').innerHTML = `<g fill="#E8FF3A">${splatPath(7, 50, 50, 32)}</g>`;
})();

function splash(btn, ev, color){
  const r = btn.getBoundingClientRect();
  const x = (ev && ev.clientX ? ev.clientX - r.left : r.width / 2);
  const y = (ev && ev.clientY ? ev.clientY - r.top : r.height / 2);
  const wrap = document.createElement('div');
  wrap.className = 'splash';
  wrap.style.left = x + 'px'; wrap.style.top = y + 'px';
  wrap.innerHTML = splatSvg((Math.random() * 1e9) | 0, color);
  btn.appendChild(wrap);
  setTimeout(() => wrap.remove(), 520);
}
const buzz = ms => { try { navigator.vibrate && navigator.vibrate(ms); } catch (e) {} };

/* ---------- 描画 ---------- */
function parseNum(v, allowDecimal){
  const s = String(v).replace(/[０-９]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xFEE0)).replace(/[−ー－]/g, '-').replace(/[^\d.\-]/g, '');
  if (s === '' || s === '-' || s === '.') return null;
  const n = allowDecimal ? parseFloat(s) : parseInt(s, 10);
  return Number.isFinite(n) ? n : null;
}
function prevValue(field){
  const keys = Object.keys(store.days).filter(k => k < cur && store.days[k][field] != null).sort();
  return keys.length ? store.days[keys[keys.length - 1]][field] : null;
}
function diffText(el, now, before, digits){
  el.className = 'diff num';
  if (now == null || before == null){ el.textContent = ''; return; }
  const d = +(now - before).toFixed(digits);
  if (d === 0){ el.textContent = '前回と同じ'; return; }
  el.classList.add(d > 0 ? 'up' : 'down');
  el.textContent = `前回から ${d > 0 ? '+' : ''}${d.toFixed(digits)}`;
}
function totals(d){
  let w = 0, l = 0;
  RULES.forEach(r => { const x = d.rules[r.id]; if (x){ w += x.w || 0; l += x.l || 0; } });
  return { w, l };
}
const rate = (w, l) => (w + l) ? Math.round(w / (w + l) * 100) + '%' : '-';

function renderRules(){
  const d = day();
  $('rules').innerHTML = RULES.map(r => {
    const x = d.rules[r.id];
    const mini = x && (x.w || x.l) ? `${x.w || 0}-${x.l || 0}` : '';
    return `<button class="rule" style="--rc:${r.color}" data-rule="${r.id}" aria-pressed="${store.rule === r.id}">
      <svg viewBox="0 0 28 28" aria-hidden="true">${ICONS[r.id]}</svg>${r.short}<span class="mini num">${mini}</span></button>`;
  }).join('');
}
function renderScore(){
  const x = day().rules[store.rule] || { w:0, l:0 };
  $('cur-rule').textContent = store.rule;
  $('cur-w').textContent = x.w || 0;
  $('cur-l').textContent = x.l || 0;
  $('win-minus').disabled = !x.w;
  $('lose-minus').disabled = !x.l;
}
function renderTable(){
  const d = day(), rows = RULES.filter(r => { const x = d.rules[r.id]; return x && (x.w || x.l); });
  if (!rows.length){ $('table').innerHTML = '<div class="empty">まだ記録がありません。WIN / LOSE をタップすると増えます。</div>'; return; }
  const t = totals(d);
  $('table').innerHTML = rows.map(r => {
    const x = d.rules[r.id], w = x.w || 0, l = x.l || 0;
    return `<div class="trow" style="--rc:${r.color}">
      <div class="rname"><i></i>${r.id}</div>
      <div><div class="track"><span class="tw" style="flex:${w}"></span><span class="tl" style="flex:${l}"></span></div>
      <div class="wltext num">${w}勝 ${l}敗</div></div>
      <div class="rate num">${rate(w, l)}</div></div>`;
  }).join('') + `<div class="total"><span class="big2 num">${t.w}勝 ${t.l}敗</span><span class="rt num">${rate(t.w, t.l)}</span></div>`;
}
function reportText(k = cur){
  const d = day(k), t = totals(d), lines = [`【インクメモ ${k}】`];
  lines.push(`ウデマエ: ${d.udemae != null ? d.udemae + 'pt' : '-'}`);
  lines.push(`XP: ${d.xp != null ? d.xp.toFixed(1) : '-'}`);
  RULES.forEach(r => { const x = d.rules[r.id]; if (x && (x.w || x.l)) lines.push(`${r.id}: ${x.w || 0}勝${x.l || 0}敗`); });
  lines.push(`合計: ${t.w}勝${t.l}敗（${rate(t.w, t.l)}）`);
  return lines.join('\n');
}
function setSign(on){
  const b = $('ud-sign');
  b.setAttribute('aria-pressed', on ? 'true' : 'false');
  b.textContent = on ? '−' : '±';
  b.setAttribute('aria-label', on ? 'プラスにする' : 'マイナスにする');
}
function renderPoints(){
  const d = day();
  const ud = $('udemae'), xp = $('xp');
  if (document.activeElement !== ud) ud.value = d.udemae != null ? Math.abs(d.udemae) : '';
  if (document.activeElement !== ud) setSign(d.udemae != null && d.udemae < 0);
  if (document.activeElement !== xp) xp.value = d.xp != null ? d.xp : '';
  diffText($('ud-diff'), d.udemae, prevValue('udemae'), 0);
  diffText($('xp-diff'), d.xp, prevValue('xp'), 1);
}
function renderHist(){
  const keys = Object.keys(store.days).sort().reverse().slice(0, 30);
  if (!keys.length){ $('hist').innerHTML = '<li class="empty">記録した日がここに並びます。</li>'; return; }
  $('hist').innerHTML = keys.map(k => {
    const d = store.days[k], t = totals(d);
    const sub = [d.udemae != null ? d.udemae + 'pt' : '', d.xp != null ? 'XP' + d.xp.toFixed(1) : ''].filter(Boolean).join(' / ') || '—';
    return `<li class="${k === cur ? 'cur' : ''}"><button data-day="${k}"><span class="hd num">${mdw(k)}</span><span class="hs num">${sub}</span><span class="hr num">${t.w}-${t.l}</span></button></li>`;
  }).join('');
}
function renderDate(){
  const today = gameToday();
  const rel = cur === today ? 'きょう' : cur === addDays(today, -1) ? 'きのう' : '';
  $('date').innerHTML = `${mdw(cur)}<small>${rel || parse(cur).getFullYear() + '年'}${cur === today ? '・4時で日付が変わります' : ''}</small>`;
  $('next').disabled = cur >= today;
  $('today').hidden = cur === today;
}
function renderAll(){ renderDate(); renderPoints(); renderRules(); renderScore(); renderTable(); $('preview').textContent = reportText(); renderHist(); }
function renderCounts(){ renderRules(); renderScore(); renderTable(); $('preview').textContent = reportText(); renderHist(); }

/* ---------- 操作 ---------- */
let toastTimer;
function toast(msg){ const t = $('toast'); t.textContent = msg; t.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.hidden = true; }, 2200); }

function bump(kind, delta, ev){
  edit(d => {
    const x = d.rules[store.rule] || { w:0, l:0 };
    x[kind] = Math.max(0, (x[kind] || 0) + delta);
    d.rules[store.rule] = x;
  });
  if (delta > 0){
    splash($(kind === 'w' ? 'win' : 'lose'), ev, kind === 'w' ? '#7B4BFF' : '#E8FF3A');
    buzz(kind === 'w' ? 18 : [10, 40, 10]);
  }
  renderCounts();
}
$('win').addEventListener('click', e => bump('w', 1, e));
$('lose').addEventListener('click', e => bump('l', 1, e));
$('win-minus').addEventListener('click', () => bump('w', -1));
$('lose-minus').addEventListener('click', () => bump('l', -1));
$('rules').addEventListener('click', e => {
  const b = e.target.closest('[data-rule]'); if (!b) return;
  store.rule = b.dataset.rule; save(); renderRules(); renderScore(); buzz(8);
});

function commitUdemae(){
  let n = parseNum($('udemae').value, false);
  if (n != null){ n = Math.abs(n) * ($('ud-sign').getAttribute('aria-pressed') === 'true' ? -1 : 1); }
  edit(d => { d.udemae = n; });
  diffText($('ud-diff'), n, prevValue('udemae'), 0);
  $('preview').textContent = reportText(); renderHist();
}
function commitXp(){
  const n = parseNum($('xp').value, true);
  edit(d => { d.xp = n != null ? Math.round(n * 10) / 10 : null; });
  diffText($('xp-diff'), day().xp, prevValue('xp'), 1);
  $('preview').textContent = reportText(); renderHist();
}
$('udemae').addEventListener('input', e => {
  if (/^[\s]*[-−ー－]/.test(e.target.value)){ setSign(true); e.target.value = e.target.value.replace(/[-−ー－]/g, ''); }
  commitUdemae();
});
$('xp').addEventListener('input', commitXp);
$('ud-sign').addEventListener('click', () => {
  setSign($('ud-sign').getAttribute('aria-pressed') !== 'true');
  commitUdemae();
});
[$('udemae'), $('xp')].forEach(el => el.addEventListener('keydown', e => { if (e.key === 'Enter') el.blur(); }));
[$('udemae'), $('xp')].forEach(el => el.addEventListener('blur', renderPoints));

function go(k){ cur = k; renderAll(); window.scrollTo({ top:0, behavior:'smooth' }); }
$('prev').addEventListener('click', () => go(addDays(cur, -1)));
$('next').addEventListener('click', () => { if (cur < gameToday()) go(addDays(cur, 1)); });
$('today').addEventListener('click', () => go(gameToday()));
$('hist').addEventListener('click', e => { const b = e.target.closest('[data-day]'); if (b) go(b.dataset.day); });

async function copyText(text, okMsg){
  try { await navigator.clipboard.writeText(text); toast(okMsg); }
  catch (e) {
    const ta = document.createElement('textarea'); ta.value = text; ta.setAttribute('readonly', ''); ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select(); ta.setSelectionRange(0, text.length);
    let ok = false; try { ok = document.execCommand('copy'); } catch (err) {}
    ta.remove(); toast(ok ? okMsg : 'コピーできませんでした。下の文を長押しでコピーしてください');
  }
}
$('copy').addEventListener('click', e => { splash($('copy'), e, '#E8FF3A'); copyText(reportText(), 'コピーしました。日報に貼り付けてください'); });
$('backup').addEventListener('click', () => copyText(JSON.stringify(store), '全データをコピーしました。メモアプリなどに貼って保管してください'));
let clearArmed = false, clearTimer;
$('clear').addEventListener('click', () => {
  if (!store.days[cur]){ toast('この日の記録はありません'); return; }
  if (!clearArmed){ clearArmed = true; $('clear').textContent = 'もう一度押すと消します'; clearTimeout(clearTimer); clearTimer = setTimeout(() => { clearArmed = false; $('clear').textContent = 'この日の記録を消す'; }, 3000); return; }
  clearArmed = false; $('clear').textContent = 'この日の記録を消す';
  delete store.days[cur]; save(); renderAll(); toast(`${mdw(cur)} の記録を消しました`);
});

// 日付をまたいで開きっぱなしでも、戻ってきたら今日に合わせる
let lastToday = gameToday();
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState !== 'visible') return;
  const t = gameToday();
  if (t !== lastToday){ if (cur === lastToday) cur = t; lastToday = t; }
  renderAll();
});

renderAll();
if ('serviceWorker' in navigator && location.protocol !== 'file:') navigator.serviceWorker.register('sw.js').catch(() => {});
})();
</script>
</body>
</html>
